<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机型年代与来源 · 华为手机九章游历</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#202833;font-family:"Songti SC","Noto Serif SC",serif}main{max-width:1180px;margin:32px auto;padding:0 24px}a{color:#a9403b;text-underline-offset:4px}.top{font:14px/1.8 system-ui;margin-bottom:28px}h1{font-size:32px;font-weight:500;letter-spacing:2px}p{color:#716b63;line-height:1.9}.filters{display:flex;flex-wrap:wrap;gap:14px;padding:20px 0;border-top:1px solid #d7d0c6;border-bottom:1px solid #d7d0c6}label{font:14px/1.9 system-ui}input,select,button{font:15px system-ui;border:1px solid #bfb3a6;background:#fffdf9;color:#202833;padding:10px}input{width:230px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#status{font:14px/1.8 system-ui;color:#a9403b}article{padding:22px 0;border-bottom:1px solid #d7d0c6}article header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h2{font-size:22px;font-weight:500;margin:0}.date{color:#a9403b;font:14px/1.8 system-ui}article p{margin:8px 0;font-size:14px}summary{cursor:pointer;font-size:14px;color:#716b63}ul{font:14px/1.9 system-ui;padding-left:20px;overflow-wrap:anywhere}.pager{display:flex;align-items:center;gap:20px;padding:28px 0;font:14px system-ui}footer{font-size:13px;line-height:1.8;color:#716b63;padding:20px 0 36px;border-top:1px solid #d7d0c6}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a9403b;outline-offset:3px}@media(max-width:650px){main{padding:0 16px}h1{font-size:26px}article header{display:block}.date{display:block;margin-top:6px}.filters label:first-child{width:100%}input{width:100%}}
</style></head><body><main>
<div class="top"><a href="index.html">作品首页</a> · <a href="watch.html">观看全集</a> · <a href="promotion.html">封面与文案</a> · <a href="data/catalog.json" download>下载公开资料 JSON</a></div>
<h1>机型年代与来源</h1><p>1106条资料记录，451个入片节点。默认按年份、发布月份升序排列；推算年月、冲突与来源分别保留。别名、历史支线和待核记录仍在库中，数量不代表已确认的独立机型总数。</p>
<div class="filters"><label>型号或系列 <input id="query" type="search" placeholder="例如：P60、Mate、nova" autocomplete="off"></label><label>年份 <select id="year"><option value="">全部年份</option></select></label><label>范围 <select id="scope"><option value="all">全部资料</option><option value="film">451个入片节点</option><option value="inferred">含推断年月</option><option value="conflict">存在年月冲突</option></select></label></div>
<p id="status" role="status" aria-live="polite">正在读取公开资料…</p><section id="results" aria-label="机型资料列表"></section><div class="pager"><button id="prev" disabled>上一页</button><span id="page"></span><button id="next" disabled>下一页</button></div>
<footer>资料快照：2026年10月6日。来源链接是核查线索；宣布、上市与候选日期按原语义标注。<a href="https://github.com/dososo/huawei-phone-journey/issues">提交资料纠错</a> · <a href="https://github.com/dososo/huawei-phone-journey/blob/main/ASSET-LICENSE.md">素材许可范围</a></footer>
</main><script>
const query=document.querySelector('#query'),year=document.querySelector('#year'),scope=document.querySelector('#scope'),results=document.querySelector('#results'),status=document.querySelector('#status'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
let models=[],filmIds=new Set(),page=0,filtered=[];const size=50;
function node(tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;return el;}
function link(text,url){const a=node('a',text);try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return node('span',text);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}catch{return node('span',text);}return a;}
function render(){
 const term=query.value.trim().toLocaleLowerCase();filtered=models.filter(m=>!term||[m.name,m.series].join(' ').toLocaleLowerCase().includes(term)).filter(m=>!year.value||m.release.year===Number(year.value)).filter(m=>scope.value==='all'||(scope.value==='film'&&filmIds.has(m.id))||(scope.value==='inferred'&&(m.release.inferredYear||m.release.inferredMonth))||(scope.value==='conflict'&&m.release.displayLabel.includes('冲突')));
 const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);results.replaceChildren();
 for(const m of filtered.slice(page*size,(page+1)*size)){const article=document.createElement('article'),head=document.createElement('header');head.append(node('h2',m.name),node('span',m.release.displayLabel,'date'));article.append(head,node('p',m.series+' · '+(filmIds.has(m.id)?'入片节点':'资料记录')+' · '+m.imageTier));const detail=document.createElement('details');detail.append(node('summary','查看日期依据与公开来源'));detail.append(node('p',m.release.basis));const ul=document.createElement('ul');const sources=[...m.release.sources];if(m.image.pageUrl)sources.push({url:m.image.pageUrl,semantic:'图像来源',grade:''});const seen=new Set();for(const s of sources){const key=s.url+'|'+s.semantic;if(seen.has(key)||!s.url)continue;seen.add(key);const li=document.createElement('li');li.append(link(s.semantic+(s.grade?' · '+s.grade+'级来源':'')+(s.inherited?' · 继承线索':''),s.url));ul.append(li);}if(m.image.url){const li=document.createElement('li');li.append(link('查看来源图片',m.image.url));ul.append(li);}detail.append(ul);article.append(detail);results.append(article);}
 status.textContent='找到 '+filtered.length+' 条 · 按发布年月升序 · 每页50条';if(!filtered.length)results.append(node('p','没有匹配记录，请调整型号、年份或范围。'));document.querySelector('#page').textContent=(page+1)+' / '+pages;prev.disabled=page===0;next.disabled=page>=pages-1;
}
for(const control of [query,year,scope])control.addEventListener(control===query?'input':'change',()=>{page=0;render();});prev.addEventListener('click',()=>{page--;render();});next.addEventListener('click',()=>{page++;render();});
fetch('data/catalog.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{models=data.models.sort((a,b)=>a.release.year-b.release.year||a.release.month-b.release.month||a.name.localeCompare(b.name,'zh-CN'));filmIds=new Set(data.journeyIds);for(const y of [...new Set(models.map(m=>m.release.year))].sort((a,b)=>a-b)){const option=node('option',y+'年');option.value=y;year.append(option);}render();}).catch(()=>{status.textContent='资料暂时无法读取，请刷新，或从GitHub仓库查看公开catalog.json。';});
</script></body></html>
