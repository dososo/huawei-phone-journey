const data=JSON.parse(document.querySelector("#chapter-data").textContent),film=document.querySelector('#film'),preview=document.querySelector('#preview'),status=document.querySelector('#status'),nav=document.querySelector('#chapters'),download=document.querySelector('#download'),skip=document.querySelector('#skip-card');
const format=t=>{const minutes=Math.floor(t/60),seconds=(t-minutes*60).toFixed(1).padStart(4,'0');return minutes+':'+seconds;};
document.querySelector('#duration').textContent=format(data.duration);
const buttons=data.chapters.map(chapter=>{

  button.append(title,detail);nav.append(button);
  button.addEventListener('click',()=>{preview.pause();film.currentTime=skip.checked?chapter.journeyStart:chapter.start;film.play().catch(()=>{status.textContent='已定位到章节。请用影片播放按钮开始观看。';});});
  return button;
});
film.addEventListener('loadedmetadata',()=>{buttons.forEach(button=>button.disabled=false);download.textContent='下载九章全集';status.textContent='影片已就绪 · '+format(film.duration)+' · 可按章跳转';});
